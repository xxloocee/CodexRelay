name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "$env:ProgramFiles\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          $skipChecks = '${{ matrix.arch }}' -eq 'arm64'
          .\build-windows-release.ps1 `
            -Architecture '${{ matrix.arch }}' `
            -Version $env:RELEASE_VERSION `
            -SkipChecks:$skipChecks

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/CodexRelay-*-${{ matrix.arch }}.exe
            dist/CodexRelay-*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: amd64
          - runner: macos-14
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
        run: bash ./build-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/CodexRelay-*.dmg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build and package
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          ARCH: ${{ matrix.arch }}
        run: bash ./build-linux-release.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/CodexRelay-*-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate package checksums
        run: |
          find release-assets -maxdepth 1 -type f \( -name 'CodexRelay-*.exe' -o -name 'CodexRelay-*.dmg' -o -name 'CodexRelay-*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  release-assets/#  #' > release-assets/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodexRelay $RELEASE_TAG" \
            --generate-notes
